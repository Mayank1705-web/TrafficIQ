<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56" role="img">
  <title>TrafficIQ Logo</title>
  <!-- Hexagon background fill -->
  <polygon points="28,2 52,15 52,41 28,54 4,41 4,15"
           fill="#7c3aed" opacity="0.12"/>
  <!-- Hexagon border -->
  <polygon points="28,2 52,15 52,41 28,54 4,41 4,15"
           fill="none" stroke="#7c3aed" stroke-width="1.5"/>
  <!-- T letter -->
  <text x="28" y="38"
        font-family="'Poppins', 'Inter', sans-serif"
        font-size="36"
        font-weight="700"
        fill="#7c3aed"
        text-anchor="middle">T</text>
  <!-- Pulse dot -->
  <circle cx="42" cy="10" r="5" fill="#ec4899"/>
  <!-- Pulse ring 1 -->
  <circle cx="42" cy="10" r="9" fill="none" stroke="#ec4899" stroke-width="1.5" opacity="0.4"/>
  <!-- Pulse ring 2 -->
  <circle cx="42" cy="10" r="13" fill="none" stroke="#ec4899" stroke-width="1" opacity="0.15"/>
</svg>